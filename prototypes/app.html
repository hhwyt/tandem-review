<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tandem Review</title>
<style>
:root{
  --bg:#faf9f5;--surface:#ffffff;--surface2:#f5f4ed;--line:#e6e3d8;--text:#141413;--dim:#7a786f;
  --accent:#c96442;--adds:#4f7d3c;--dels:#b0503a;--kw:#a9502f;--str:#4f7d3c;--fn:#5b5bb5;--com:#9a978c;--hl:#f5c400;
  --line2:color-mix(in srgb,var(--line) 55%,var(--bg));--text2:color-mix(in srgb,var(--text) 78%,var(--bg));
  --accent-ink:color-mix(in srgb,var(--accent) 85%,var(--text));--accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));--accent-line:color-mix(in srgb,var(--accent) 38%,var(--surface));
  --add:color-mix(in srgb,var(--adds) 9%,var(--surface));--addg:color-mix(in srgb,var(--adds) 18%,var(--surface));
  --del:color-mix(in srgb,var(--dels) 9%,var(--surface));--delg:color-mix(in srgb,var(--dels) 18%,var(--surface));
  --hunk:var(--surface2);--sel:color-mix(in srgb,var(--hl) 22%,var(--surface));--range:color-mix(in srgb,var(--accent) 9%,var(--surface));
  --t1:var(--accent);--t2:color-mix(in srgb,var(--accent) 55%,var(--text));--t3:color-mix(in srgb,var(--fn) 80%,var(--text));--t4:var(--adds);--t5:var(--dim);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
  --serif:"Tiempos Headline","Iowan Old Style","Charter","Georgia","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
.skinbtn{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:inline-block;flex:none}
.skinpop{position:fixed;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px;width:300px;display:grid;grid-template-columns:1fr 1fr;gap:6px;animation:fade .12s}
.skin{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12.5px;background:var(--bg);color:var(--text)}
.skin:hover{border-color:var(--dim)}
.skin.on{outline:2px solid var(--accent);outline-offset:1px}
.skin .pal{display:flex}.skin .pal i{width:10px;height:22px;display:block}.skin .pal i:first-child{border-radius:4px 0 0 4px}.skin .pal i:last-child{border-radius:0 4px 4px 0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink);text-decoration:none}a:hover{text-decoration:underline}
::selection{background:var(--accent-line)}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--dim)} .plus-n{color:var(--adds);font-weight:600} .minus-n{color:var(--dels);font-weight:600}
.sp{flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;cursor:pointer;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--dim)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface2)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.count{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
.kbd{font:11px/16px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--dim);background:var(--surface)}
.seg{display:flex;background:var(--surface2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;height:26px;padding:0 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--dim)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:0 8px;border-radius:6px;line-height:20px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.tagline{display:inline-block;font-size:11px;line-height:18px;padding:0 7px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.tagline.new{color:var(--adds);border-color:color-mix(in srgb,var(--adds) 40%,transparent)}
.tagline.mod{color:var(--t2);border-color:color-mix(in srgb,var(--t2) 40%,transparent)}
/* top bar */
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.brand{font:600 17px var(--serif);display:flex;align-items:center;gap:6px;letter-spacing:-.01em}
.brand .spark{color:var(--accent);font-size:16px}
.prref{font-size:12.5px;color:var(--dim)}
.tabs{display:flex;gap:2px;margin-left:12px;height:100%}
.tabs button{border:0;background:none;padding:0 12px;cursor:pointer;font-size:13.5px;color:var(--dim);border-bottom:2px solid transparent;height:100%}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.ring{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.ring svg{display:block}
.main{flex:1;min-height:0;display:flex}
/* overview */
.ov{flex:1;overflow:auto;background:transparent}
.ovw{max-width:920px;margin:0 auto;padding:32px 28px 60px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.h1{font:500 28px/1.25 var(--serif);letter-spacing:-.015em;margin:6px 0 12px}
.lede{font:17px/1.6 var(--serif);color:var(--text2);margin:0}
.sec{margin-top:34px}
.sec h2{font:500 19px var(--serif);margin:0 0 12px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.sec h2 small{font:13px var(--sans);color:var(--dim)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px}
.gnode{cursor:pointer}.gnode rect{transition:stroke-width .15s}.gnode:hover rect{stroke-width:2.4}.garrow{fill:var(--accent);opacity:.75;transition:opacity .15s,transform .15s}.gnode:hover .garrow{opacity:1}.gnode rect{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.08))}.gnode:hover rect{filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.dcard.go{cursor:pointer}.dcard.go:hover{border-color:var(--accent-line)}
.golink{font:11.5px var(--mono);color:var(--accent-ink);border-bottom:1px dashed var(--accent-line)}.dcard.go:hover .golink{border-bottom-style:solid}.dcard.go:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.dcard .q{font-weight:600;margin:4px 0 2px;font-size:14px;line-height:1.45}
.dcard .n{color:var(--dim);font-size:13px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;padding:6px 0}
.steps li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface2);color:var(--text2);font:600 12px/22px var(--sans);text-align:center}
.cov{list-style:none;margin:0;padding:0}
.cov li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)}
.cov li:last-child{border-bottom:0}
.cov .m{flex:none;width:18px;font-weight:700;text-align:center}
details.files summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.files summary::-webkit-details-marker{display:none}
details.files summary:before{content:"›";display:inline-block;transition:transform .15s;color:var(--dim);font-size:18px}
details.files[open] summary:before{transform:rotate(90deg)}
.ftab{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.ftab td{padding:7px 8px;border-top:1px solid var(--line2);vertical-align:top}
.ftab .grp td{border-top:0;padding-top:14px}
.plan{position:sticky;top:24px;align-self:start}
.plan .card{padding:16px}
.plan h3{font:500 17px var(--serif);margin:0 0 2px}
.plan .meta{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.pgrp{font-size:11.5px;font-weight:600;margin:12px 0 4px;display:flex;align-items:center;gap:6px;color:var(--text2)}
.pit{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer}
.pit:hover{background:var(--surface2)}
.pit .no{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);font:600 11px/17px var(--sans);text-align:center;color:var(--dim)}
.pit.done .no{background:var(--adds);border-color:var(--adds);color:#fff}
.pit .fn{font:600 12.5px var(--mono);word-break:break-all;color:var(--text)}
.pit .w{font-size:12px;color:var(--dim);line-height:1.45}
.pit.off{opacity:.5;cursor:default}
/* review */
.queue{width:288px;border-right:1px solid var(--line);overflow:auto;flex:none;background:var(--bg)}
.qhead{position:sticky;top:0;background:var(--bg);padding:12px 14px 10px;border-bottom:1px solid var(--line2);z-index:2}
.qgrp{padding:14px 14px 4px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--text2)}
.qit{display:flex;gap:10px;align-items:flex-start;padding:7px 14px;cursor:pointer;border-left:2px solid transparent}
.qit:hover{background:var(--surface2)}
.qit.on{background:var(--surface);border-left-color:var(--accent)}
.qit .st{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;font-size:10px;line-height:13px;text-align:center;color:#fff}
.qit.done .st{background:var(--adds);border-color:var(--adds)}
.qit .fn{font:500 12.5px var(--mono);word-break:break-all;color:var(--text)}
.qit .sub{font-size:11.5px;color:var(--dim)}
.qit.off{opacity:.45;cursor:default}
.center{flex:1;overflow:auto;min-width:0;position:relative}
.cw{max-width:1040px;margin:0 auto;padding:22px 26px 90px}
.uhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.uname{font:600 17px var(--mono);letter-spacing:-.01em;word-break:break-all}
.upos{font-size:12.5px;color:var(--dim)}
.intro{margin:12px 0 16px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;user-select:none}
.intro b{color:var(--accent-ink);font-weight:600;white-space:nowrap}
.code{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.code .fh{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:12.5px}
.hunk{font:12px/22px var(--mono);background:var(--hunk);color:var(--dim);padding:0 14px 0 116px}
.fold{display:flex;align-items:center;gap:8px;font:12px/24px var(--sans);color:var(--dim);background:var(--hunk);padding-left:116px;cursor:pointer;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.fold:hover{color:var(--text)}
.dl{display:flex;font:12.5px/22px var(--mono);position:relative}
.dl .o,.dl .nn{width:50px;text-align:right;padding-right:10px;color:var(--dim);flex:none;user-select:none;cursor:pointer;font-size:11.5px}
.dl .mk{width:16px;flex:none;text-align:center;user-select:none;color:var(--dim)}
.dl .c{white-space:pre;flex:1;padding-right:18px;min-width:0;overflow:hidden;color:var(--text)}
.dl.add{background:var(--add)} .dl.add .o,.dl.add .nn{background:var(--addg)} .dl.add .mk{color:var(--adds)}
.dl.del{background:var(--del)} .dl.del .o,.dl.del .nn{background:var(--delg)} .dl.del .mk{color:var(--dels)}
.dl.inrange{background:var(--range)!important}
.dl.sel{background:var(--sel)!important}
.dl.lit:after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.dl .add-c{position:absolute;left:98px;top:2px;width:18px;height:18px;border-radius:5px;background:var(--accent);color:#fff;font:600 13px/18px var(--sans);text-align:center;display:none;z-index:2;cursor:pointer}
.dl:hover .add-c{display:block}
.kw{color:var(--kw)}.str{color:var(--str)}.fnc{color:var(--fn)}.com{color:var(--com);font-style:italic}
.flash{animation:fl 1.6s ease}@keyframes fl{0%{background:var(--addg)}100%{}}
.ghost{display:flex;align-items:flex-start;font:italic 13px/20px var(--serif);color:var(--accent-ink);background:color-mix(in srgb,var(--accent-soft) 70%,transparent);border-top:1px dashed var(--accent-line);border-bottom:1px dashed var(--accent-line);user-select:none;-webkit-user-select:none;padding:3px 0;cursor:default;transition:background .15s}
.ghost:hover{background:var(--accent-soft)}
.ghost .gg{width:116px;flex:none;text-align:right;padding-right:12px;font-style:normal;color:var(--accent)}
.ghost .gt{flex:1;padding-right:18px}
.noAI .ghost,.noAI .intro,.noAI .callchip{display:none}
.callchip{margin-left:14px;font:italic 12px var(--serif);color:var(--accent-ink);background:var(--accent-soft);border:1px dashed var(--accent-line);border-radius:6px;padding:0 7px;cursor:pointer;user-select:none;white-space:nowrap}
.callchip:hover{border-style:solid;text-decoration:none}
.chap{padding:16px 14px 4px}.pit+.chap,.chap:first-child{}
.plan .chap{padding:12px 0 2px}
.chn{font:500 14px var(--serif);color:var(--text)}
.chs{font-size:11.5px;color:var(--dim)}
.thread{margin:8px 18px 12px 116px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;box-shadow:var(--shadow);font-family:var(--sans)}
.thread .th{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line2);font-size:12.5px}
.thread .tb{padding:9px 12px;line-height:1.55}
.thread .rng{font:11.5px var(--mono);color:var(--dim)}
.kind{border-radius:5px;font-size:11px;line-height:18px;padding:0 7px;font-weight:600}
.k0{background:color-mix(in srgb,var(--dels) 15%,transparent);color:var(--dels)}
.k1{background:color-mix(in srgb,var(--t2) 18%,transparent);color:var(--t2)}
.k2{background:color-mix(in srgb,var(--t3) 18%,transparent);color:var(--t3)}
.verd{margin:0 12px 10px;border-radius:8px;background:var(--add);padding:6px 10px;font-size:12.5px}.verd b{color:var(--adds)}
.form{margin:8px 18px 12px 116px;border:1px solid var(--accent-line);border-radius:10px;padding:10px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--sans)}
.form .row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.form .kinds button{border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;height:24px;padding:0 9px;cursor:pointer}
.form .kinds button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.form textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);resize:vertical;outline:none}
.form textarea:focus{border-color:var(--accent)}
.form .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;align-items:center}
.ufoot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 26px 14px}
.ufoot .in{max-width:988px;padding-right:44px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hints{display:flex;gap:12px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.ctx{width:316px;border-left:1px solid var(--line);overflow:auto;flex:none;background:var(--bg)}
.ctx .seg{margin:12px 14px}
.ctx .pad{padding:0 16px 20px}
.ctree{list-style:none;margin:0;padding:0 0 0 14px;position:relative}
.ctree.root{padding-left:0}
.ctree li{position:relative;padding-left:16px}
.ctree.root>li{padding-left:0}
.ctree li:before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line)}
.ctree li:last-child:before{bottom:auto;height:13px}
.ctree li:after{content:"";position:absolute;left:0;top:13px;width:11px;border-top:1px solid var(--line)}
.ctree.root>li:before,.ctree.root>li:after{display:none}
.tn{padding:2px 0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:22px}
.ctree-wrap>.ctree{padding-left:0}.ctree-wrap>.ctree>li{padding-left:0}.ctree-wrap>.ctree>li:before,.ctree-wrap>.ctree>li:after{display:none}
.tfold{font-size:11.5px;color:var(--dim);border:1px dashed var(--line);border-radius:5px;padding:0 7px;cursor:pointer;background:var(--surface)}
.tfold:hover{color:var(--text);border-color:var(--dim)}
.cn.key{color:var(--text);font-weight:600}
.tn.seq{position:relative;padding-left:12px}
.tn.seq:before{content:"";position:absolute;left:3px;top:0;bottom:0;border-left:1px solid var(--line)}
.tn.seq:after{content:"";position:absolute;left:1px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--line)}
.me-node{display:inline-block;font:600 12.5px var(--mono);background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-ink);border-radius:6px;padding:0 8px;margin:2px 0}
.ctx .lab{font-size:11.5px;color:var(--dim);margin:14px 0 6px;font-weight:600;letter-spacing:.02em}
.ctx .row{padding:3px 0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn{color:var(--text2);cursor:pointer;font:12.5px var(--mono)}.cn:hover{color:var(--accent-ink);text-decoration:underline}
.cn.pr{color:var(--accent-ink);font-weight:600}
.me{font:600 12.5px var(--mono);color:var(--text)}
.gap{color:var(--dim);font-size:12px}
.loc{font:11px var(--mono);color:var(--dim);margin-left:6px}
.tree .row{position:relative}
.citem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--surface);cursor:pointer;font-size:13px}
.citem:hover{border-color:var(--dim)}
.citem .l{font:11.5px var(--mono);color:var(--dim);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.empty{color:var(--dim);font-size:13px;padding:6px 0}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(20,20,19,.35);display:flex;align-items:center;justify-content:center;z-index:30;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.mbox{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(600px,92vw);padding:20px 22px;max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mbox h3{font:500 19px var(--serif);margin:0 0 12px}
.mbox pre{white-space:pre-wrap;font:12.5px/1.6 var(--mono);background:var(--surface2);padding:12px;border-radius:8px;margin:0}
.help td{padding:5px 10px 5px 0;font-size:13.5px}
.bgart{position:fixed;right:28px;bottom:20px;width:420px;aspect-ratio:260/120;z-index:0;pointer-events:none;opacity:.13;display:none}
.bgart.on{display:block}
.bgart svg{width:100%;height:100%;display:block}
.main{position:relative;z-index:1}
.ghlink{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--dim);background:var(--surface);transition:color .15s,border-color .15s}.ghlink:hover{color:var(--text);border-color:var(--dim);text-decoration:none}
.vsep{width:1px;height:20px;background:var(--line);margin:0 4px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--dim);cursor:pointer;transition:color .15s,border-color .15s}.iconbtn:hover{color:var(--text);border-color:var(--dim)}
.setpop{position:fixed;z-index:45;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.16);padding:12px 14px;animation:fade .12s}
.setpop .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px}
.setpop .slab{font-size:12px;color:var(--dim);margin:10px 0 6px;font-weight:600}
.setpop .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.helpfab{position:fixed;right:18px;bottom:18px;z-index:25;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--dim);font:600 15px var(--sans);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,color .15s}
.helpfab:hover{color:var(--accent);transform:translateY(-2px)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:40;box-shadow:var(--shadow)}
.iconbtn.hint,.seg.hint{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.langtip{position:fixed;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;padding:4px 10px;border-radius:6px;z-index:50}
.langtip:before{content:"";position:absolute;left:50%;top:-5px;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--text)}
svg text{font-family:var(--sans)}
/* motion: calm by default, a few moments of delight */
.brand .spark{display:inline-block;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
section[id^="u-"]{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ghost{position:relative;overflow:hidden}
.ghost:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--accent) 18%,transparent) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 1.6s ease .2s 1}
@keyframes sheen{to{transform:translateX(100%)}}
.card,.dcard,.citem,.pit,.qit{transition:transform .18s ease,box-shadow .18s ease,background .15s,border-color .15s}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ring circle:last-child{transition:stroke-dasharray .5s cubic-bezier(.2,.7,.2,1)}
.ov .h1,.ov .lede,.ov .sec{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.ov .lede{animation-delay:.05s}.ov .sec:nth-of-type(1){animation-delay:.1s}.ov .sec:nth-of-type(2){animation-delay:.15s}.ov .sec:nth-of-type(3){animation-delay:.2s}
.flowdash{stroke-dasharray:4 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.confetti{position:fixed;top:-10px;width:8px;height:12px;border-radius:2px;z-index:60;pointer-events:none;animation:fall 1.8s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1180px){.ctx{display:none}}
@media (max-width:860px){.queue{display:none}.ovw,.grid2,.decide{grid-template-columns:1fr}.thread,.form{margin-left:18px}.plan{position:static}}

function goUnit(id,line){S.page='review';S.cur=id;S.sel=null;S.range=null;if(S.mode==='file')S.file=U(id).file;render();const c=document.getElementById('center');if(c)c.scrollTop=0;if(S.mode==='file')document.getElementById('u-'+id)?.scrollIntoView({block:'start'});if(line){const el=document.querySelector(`.dl[data-u="${id}"][data-n="${line}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}}}

function addComment(){const ta=document.getElementById('ta');const v=ta&&ta.value.trim();if(!v)return;const n=+S.form.split(':')[1];S.cm.push({id:Date.now(),k:S.form,kind:S.kind,text:v,sent:false,range:S.range||[n,n]});S.form=null;S.range=null;keepScroll(render)}

 m.addEventListener('click',e=>{if(e.target===m)m.remove()});m.querySelector('#mCancel').onclick=()=>m.remove();m.querySelector('#mCopy').onclick=()=>{navigator.clipboard?.writeText(exportMD(list));toast(L(UI.copied))};
