<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>调用栈原型</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f6f8fa;--line:#d0d7de;--line2:#eaeef2;--text:#1f2328;--dim:#656d76;
  --blue:#0969da;--green:#1a7f37;--red:#cf222e;--add:#e6ffec;--addg:#ccffd8;--del:#ffebe9;--delg:#ffd7d5;
  --hunk:#ddf4ff;--sel:#fff8c5;--btn:#f6f8fa;
  --ai:#8250df;--ai-soft:#fbefff;--ai-line:#d8b9ff;--ai-text:#6e40c9;
  --kw:#cf222e;--str:#0a3069;--fn:#8250df;--com:#6e7781;
  --b1:#c4b5fd;--b2:#93c5fd;--b3:#86efac;--b4:#fcd34d;--b5:#f9a8d4;--b6:#a5b4fc;--b7:#5eead4;
}
:root[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--line:#30363d;--line2:#21262d;--text:#e6edf3;--dim:#8d96a0;
  --blue:#4493f8;--green:#3fb950;--red:#f85149;--add:#12261e;--addg:#1b4721;--del:#25171c;--delg:#542426;
  --hunk:#121d2f;--sel:#3a3416;--btn:#21262d;
  --ai:#a371f7;--ai-soft:#1d1530;--ai-line:#5a3e8f;--ai-text:#c9a7ff;
  --kw:#ff7b72;--str:#a5d6ff;--fn:#d2a8ff;--com:#8b949e;
  --b1:#6d28d9;--b2:#1d4ed8;--b3:#15803d;--b4:#b45309;--b5:#be185d;--b6:#4338ca;--b7:#0f766e;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117;--bg2:#161b22;--line:#30363d;--line2:#21262d;--text:#e6edf3;--dim:#8d96a0;
  --blue:#4493f8;--green:#3fb950;--red:#f85149;--add:#12261e;--addg:#1b4721;--del:#25171c;--delg:#542426;
  --hunk:#121d2f;--sel:#3a3416;--btn:#21262d;
  --ai:#a371f7;--ai-soft:#1d1530;--ai-line:#5a3e8f;--ai-text:#c9a7ff;
  --kw:#ff7b72;--str:#a5d6ff;--fn:#d2a8ff;--com:#8b949e;
  --b1:#6d28d9;--b2:#1d4ed8;--b3:#15803d;--b4:#b45309;--b5:#be185d;--b6:#4338ca;--b7:#0f766e;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .logo{font-weight:700}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--blue)}
.stat{font-size:13px;color:var(--dim)} .stat b.a{color:var(--green)} .stat b.d{color:var(--red)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--btn);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.ai{border-color:var(--ai-line);color:var(--ai-text)}
.btn.on{background:var(--ai-soft);border-color:var(--ai);color:var(--ai-text)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--btn);padding:4px 12px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff}
.prog{width:80px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.main{flex:1;display:flex;min-height:0}
.tree{width:260px;border-right:1px solid var(--line);overflow:auto;padding:8px 0;flex:none;font-size:13.5px}
.tree .d{padding:3px 14px;font-weight:600;color:var(--dim)}
.tree .f{padding:3px 14px 3px 28px;display:flex;gap:6px;align-items:center;cursor:pointer}
.tree .f:hover{background:var(--bg2)}
.tree .f.on{background:var(--hunk);box-shadow:inset 3px 0 var(--blue)}
.tree .f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .f .s{font-size:12px;color:var(--green)}
.tree .fn{padding:2px 14px 2px 44px;font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree .fn:hover{color:var(--text)}
.content{flex:1;overflow:auto;padding:16px;min-width:0;position:relative}
.card{border:1px solid var(--line);border-radius:8px;margin-bottom:18px;background:var(--bg)}
.card>.h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;position:sticky;top:-16px;z-index:3}
.card>.h .path{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.card>.h .path b{font-weight:600}
.tag{border:1px solid var(--line);border-radius:999px;font-size:12px;padding:0 8px;color:var(--dim)}
.viewed{display:flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;background:var(--bg)}
.hunk{font:12.5px/20px ui-monospace,Menlo,monospace;background:var(--hunk);color:var(--dim);padding:2px 12px 2px 110px}
.hunk .fnl{color:var(--text)}
.dl{display:flex;font:12.5px/20px ui-monospace,Menlo,monospace;position:relative}
.dl .o,.dl .nn{width:48px;text-align:right;padding-right:8px;color:var(--dim);flex:none;user-select:none;cursor:pointer;position:relative}
.dl .mk{width:18px;flex:none;text-align:center;user-select:none;color:var(--dim)}
.dl .c{white-space:pre;flex:1;padding-right:16px;min-width:0;overflow:hidden}
.dl.add{background:var(--add)} .dl.add .o,.dl.add .nn{background:var(--addg)}
.dl.del{background:var(--del)} .dl.del .o,.dl.del .nn{background:var(--delg)}
.dl.sel{background:var(--sel)!important}
.dl .plus{position:absolute;left:96px;top:1px;width:20px;height:18px;border-radius:5px;background:var(--blue);color:#fff;font:600 14px/18px system-ui;text-align:center;display:none;z-index:2;cursor:pointer}
.dl:hover .plus{display:block}
.kw{color:var(--kw)}.str{color:var(--str)}.fnc{color:var(--fn)}.com{color:var(--com)}
.flash{animation:fl 1.6s ease}@keyframes fl{0%{background:var(--addg)}100%{}}
/* comments */
.thread{margin:8px 16px 10px 110px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.thread .th{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line2)}
.thread .tb{padding:8px 12px}
.kind{border-radius:999px;font-size:12px;padding:0 8px;color:#fff;background:var(--red)}
.kind.k2{background:#9a6700}.kind.k3{background:var(--blue)}
.verdict{margin:0 12px 10px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
.verdict b{color:var(--green)}
.form{margin:8px 16px 10px 110px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}
.form .kinds{display:flex;gap:6px;margin-bottom:8px}
.form .kinds button{border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:12px;padding:1px 10px;cursor:pointer}
.form .kinds button.on{background:var(--text);color:var(--bg)}
.form textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--text);font:14px/1.5 inherit;resize:vertical}
.form .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
/* AI common */
.ai-mark{color:var(--ai)}
.ov{margin:10px 12px;border:1px dashed var(--ai-line);border-radius:8px;background:var(--ai-soft);padding:8px 12px;font-size:13.5px;color:var(--text)}
.ov .t{font-size:12px;color:var(--ai-text);font-weight:600;display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.ov .body{margin-top:6px}
.ov svg{display:block;margin-top:8px;max-width:100%}
.ov.fold .body{display:none}
.noselect{user-select:none;-webkit-user-select:none}
/* V1 ghost lines */
.ghost{display:flex;font:italic 13px/20px -apple-system,"PingFang SC",sans-serif;color:var(--ai-text);opacity:.82;background:repeating-linear-gradient(90deg,transparent 0 6px,color-mix(in srgb,var(--ai-soft) 70%,transparent) 6px 12px);border-top:1px dashed var(--ai-line);border-bottom:1px dashed var(--ai-line);animation:gin .35s ease}
.ghost .gg{width:114px;flex:none;text-align:right;padding-right:10px;font-style:normal}
.ghost .gt{flex:1;padding:2px 16px 2px 0;white-space:normal}
@keyframes gin{from{opacity:0;transform:translateY(-2px)}to{opacity:.82}}
.hideAI .ghost,.hideAI .inlay,.hideAI .band,.hideAI .ov{display:none!important}
.hideAI .notes{visibility:hidden}
/* V2 margin notes */
.wrap2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.notes{position:relative}
.note{position:absolute;left:0;right:0;border-left:2px solid var(--ai-line);padding:4px 10px;font-size:13px;line-height:1.45;color:var(--dim);border-radius:0 6px 6px 0;transition:.15s;cursor:default}
.note .r{font:11px ui-monospace,Menlo,monospace;color:var(--ai-text)}
.note.hot{background:var(--ai-soft);border-left-color:var(--ai);color:var(--text)}
.dl.hot{box-shadow:inset 3px 0 var(--ai)}
.brk{position:absolute;left:0;width:4px;border-radius:2px;background:var(--ai-line);opacity:.0;transition:.15s}
/* V3 inlay */
.inlay{display:inline-block;margin-left:18px;font:12px/18px -apple-system,"PingFang SC",sans-serif;color:var(--ai-text);background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:999px;padding:0 9px;max-width:340px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;cursor:pointer;opacity:.75;white-space:nowrap}
.inlay:hover{opacity:1}
.pop{position:fixed;z-index:20;width:360px;border:1px solid var(--ai-line);background:var(--bg);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:10px 12px;font-size:13.5px}
.pop .r{font:11px ui-monospace,Menlo,monospace;color:var(--ai-text);margin-bottom:4px}
/* V4 bands + drawer */
.band{position:absolute;left:0;top:0;bottom:0;width:6px;cursor:pointer;opacity:.75}
.band:hover{opacity:1;width:9px}
.drawer{width:0;overflow:hidden;border-left:1px solid var(--line);transition:width .25s ease;flex:none;background:var(--bg2)}
.drawer.open{width:380px}
.drawer .in{width:380px;padding:14px;height:100%;overflow:auto}
.drawer .x{float:right;cursor:pointer;color:var(--dim)}
.drawer .r{font:12px ui-monospace,Menlo,monospace;color:var(--ai-text)}
.drawer pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/18px ui-monospace,Menlo,monospace;overflow:auto;white-space:pre}
/* V5 spotlight */
.spot .dl,.spot .hunk,.spot .thread{transition:opacity .25s,filter .25s}
.spot .dl.dim,.spot .hunk.dim{opacity:.22;filter:grayscale(.6)}
.spotcard{position:absolute;z-index:6;width:340px;border:1px solid var(--ai);background:var(--bg);border-radius:10px;box-shadow:0 10px 30px rgba(130,80,223,.25);padding:10px 12px;font-size:13.5px;transition:top .3s ease}
.spotcard .r{font:11px ui-monospace,Menlo,monospace;color:var(--ai-text)}
.spotcard .nav{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:12px;color:var(--dim)}
.kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:30}
.modal .box{background:var(--bg);border-radius:10px;border:1px solid var(--line);width:min(560px,92vw);padding:16px;max-height:80vh;overflow:auto}
.modal pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:var(--bg2);padding:10px;border-radius:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:40}
.cn{color:var(--blue);text-decoration:none;cursor:pointer;font:12.5px ui-monospace,Menlo,monospace}
.cn:hover{text-decoration:underline}.cn.pr{color:var(--ai-text);font-weight:600}
.loc{font:11px ui-monospace,Menlo,monospace;color:var(--dim);margin-left:6px}
.cs .lab{font-size:11.5px;color:var(--dim);margin:8px 0 4px;font-weight:600}
.cs .row{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs .gap{color:var(--dim);font-size:12px;padding:2px 0}
.cs .me{font:600 12.5px ui-monospace,Menlo,monospace;color:var(--text)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.chain{margin-top:6px;font-size:12.5px;line-height:1.9}
.chain .ar{color:var(--dim);margin:0 4px}
.side{width:320px;border-left:1px solid var(--line);background:var(--bg2);overflow:auto;padding:12px 14px;flex:none}
.side h4{margin:0 0 4px;font-size:13px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line2);font-size:12.5px;background:var(--bg)}
.crumb .ar{color:var(--dim);margin:0 3px}
.crumb .more{color:var(--dim);cursor:pointer;border:1px dashed var(--line);border-radius:4px;padding:0 5px}
.callee{display:flex;gap:6px;flex-wrap:wrap;padding:4px 12px 6px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line2)}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 8px;background:var(--bg)}
.tree .cs{border-top:1px solid var(--line);margin-top:10px;padding:8px 14px}
.indent{display:block}
.vtabs{display:flex;gap:4px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.vtabs button{border:1px solid transparent;background:none;border-radius:6px;padding:3px 12px;cursor:pointer;font-size:13px;color:var(--dim)}
.vtabs button.on{border-color:var(--ai-line);background:var(--ai-soft);color:var(--ai-text);font-weight:600}
@media (max-width:900px){.tree{display:none}.wrap2{grid-template-columns:1fr}.notes{display:none}.drawer.open{width:100%}.thread,.form{margin-left:16px}}
</style>
</head>

</div>

 c.appendChild(card);first.scrollIntoView({block:'center',behavior:'smooth'})}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function addComment(){const ta=document.getElementById('ta');const v=ta&&ta.value.trim();if(!v)return;S.cm.push({id:Date.now(),k:S.form,kind:S.kind,text:v,sent:false});S.form=null;render()}
function exportText(list){return list.map(c=>{const [fi,ln]=c.k.split(':');return `- [${KINDS[c.kind][0]}] ${FILES[fi].path}:${ln.slice(1)}${ln[0]==='o'?'（删除行）':''}\n  ${c.text}`}).join('\n')}
function send(final){const list=S.cm.filter(c=>!c.sent);if(!list.length&&!final)return;
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3 style="margin:0 0 8px">${final?'完成 review':'发送评论'}（${list.length} 条）</h3><pre>${esc(exportText(list)||'（没有新评论）')}</pre><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" id="mCopy">复制</button><button class="btn" id="mCancel">取消</button><button class="btn go" id="mOk">发给 agent</button></div></div>`;document.body.appendChild(m);
 m.querySelector('#mCancel').onclick=()=>m.remove();
 m.querySelector('#mCopy').onclick=()=>{navigator.clipboard?.writeText(exportText(list));toast('已复制')};
 m.querySelector('#mOk').onclick=()=>{m.remove();list.forEach(c=>c.sent=true);render();toast('已写入 comments-round-'+S.round+'.md，等待 agent 修改…');
  setTimeout(()=>{FILES.forEach(f=>f.hunks.forEach(h=>h.lines.forEach(l=>{l[1]=l[1].replace(/\bchanged\b/g,'changedPhysicalIDs')})));
   list.forEach(c=>c.verdict='按评论修改，见 review 分支新 commit');S.round++;render();toast('agent 已改完，进入第 '+S.round+' 轮');
   document.querySelectorAll('.dl').forEach(el=>{if(el.textContent.includes('changedPhysicalIDs'))el.classList.add('flash')})},1800)}}
document.addEventListener('click',e=>{const t=e.target,cl=x=>t.closest(x);
 const pop=document.querySelector('.pop');if(pop&&!cl('.pop')&&!cl('.inlay'))pop.remove();
 if(cl('[data-v]')){S.v=cl('[data-v]').dataset.v;S.sel=null;S.form=null;S.spotOn=false;try{localStorage.setItem('hr-cs-v',S.v)}catch(_){}render();return}
 if(cl('[data-goto]')){e.preventDefault();const [fi,ln]=cl('[data-goto]').dataset.goto.split(':').map(Number);S.curFi=fi;if(S.v==='side'||S.v==='tree'){S.sel=null;render()}setTimeout(()=>gotoLine(fi,ln),30);return}
 if(cl('[data-crumb]')){const fi=+cl('[data-crumb]').dataset.crumb;S.crumbI=S.crumbI||{};S.crumbI[fi]=((S.crumbI[fi]||0)+1)%CALLS[fi].chains.length;render();return}
 if(cl('[data-graph]')){graphModal(+cl('[data-graph]').dataset.graph);return}
 if(t.id==='aiBtn'){S.ai=!S.ai;render();return}
 if(t.id==='themeBtn'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';render();return}
 if(cl('#spotBtn')){S.spotOn=!S.spotOn;S.spotI=0;render();return}
 if(t.id==='spPrev'){S.spotI--;render();return} if(t.id==='spNext'){S.spotI++;render();return}
 if(t.id==='sendBtn'){send(false);return} if(t.id==='finishBtn'){send(true);return}
 if(t.dataset.fold){S.folds[t.dataset.fold]=!S.folds[t.dataset.fold];render();return}
 if(cl('[data-fold]')){const k=cl('[data-fold]').dataset.fold;S.folds[k]=!S.folds[k];render();return}
 if(t.dataset.c){S.form=t.dataset.c;S.sel=t.dataset.c;S.kind=0;render();return}
 if(t.dataset.kind){S.kind=+t.dataset.kind;document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('on',+b.dataset.kind===S.kind));return}
 if(t.dataset.cancel){S.form=null;render();return}
 if(t.dataset.add){addComment();return}
 if(t.dataset.del){S.cm=S.cm.filter(c=>c.id!=t.dataset.del);render();return}
 if(t.dataset.view!=null){S.viewed[t.dataset.view]=t.checked;render();return}
 if(cl('[data-jump]')){document.getElementById('file'+cl('[data-jump]').dataset.jump)?.scrollIntoView({behavior:'smooth'});return}
 if(cl('[data-jumpfn]')){const [fi,ln]=cl('[data-jumpfn]').dataset.jumpfn.split(':');document.querySelector(`.dl[data-fi="${fi}"][data-n="${ln}"]`)?.scrollIntoView({block:'center',behavior:'smooth'});return}
 if(cl('[data-pop]')){const [fi,a]=cl('[data-pop]').dataset.pop.split(':').map(Number);document.querySelector('.pop')?.remove();const nt=allNotes(fi).find(x=>x.a===a);const p=document.createElement('div');p.className='pop noselect';p.innerHTML=`<div class="r">${nt.a}${nt.b!==nt.a?'–'+nt.b:''} · ${esc(nt.fn.name)}</div>${esc(nt.t)}`;const r=cl('[data-pop]').getBoundingClientRect();p.style.left=Math.min(innerWidth-380,r.left)+'px';p.style.top=(r.bottom+6)+'px';document.body.appendChild(p);hot(fi,a,true);return}
 if(cl('[data-band]')){const [fi,a]=cl('[data-band]').dataset.band.split(':').map(Number);drawerNote(fi,a);return}
 if(cl('[data-fnov]')){const fi=+cl('[data-fnov]').dataset.fnov;const fn=FILES[fi].fns[0];openDrawer(`<div class="r">${FILES[fi].path}</div><h3 style="margin:4px 0 8px;font-size:15px">${esc(fn.name)}</h3><p>${esc(fn.gist)}</p>${flowSVG(fn.flow)}<h4 style="margin:14px 0 6px;font-size:13px">逐段</h4>${fn.notes.map(n=>`<p style="margin:6px 0"><span class="r">${n[0]}${n[1]!==n[0]?'–'+n[1]:''}</span> ${esc(n[2])}</p>`).join('')}`);return}
 if(t.id==='dx'){closeDrawer();return}
 const dl=cl('.dl');if(dl&&!cl('.plus')){S.sel=dl.dataset.k;if((S.v==='side'||S.v==='tree')&&+dl.dataset.fi!==S.curFi){S.curFi=+dl.dataset.fi;render();return}document.querySelectorAll('.dl.sel').forEach(x=>x.classList.remove('sel'));dl.classList.add('sel');
   if(S.v==='band'&&S.ai&&dl.dataset.n){const nt=noteFor(+dl.dataset.fi,+dl.dataset.n);if(nt)drawerNote(+dl.dataset.fi,nt.a)}
   if(S.v==='spot'&&S.spotOn&&dl.dataset.n){const L=spotList();const j=L.findIndex(x=>x.fi===+dl.dataset.fi&&+dl.dataset.n>=x.a&&+dl.dataset.n<=x.b);if(j>=0){S.spotI=j;render()}}}
});
document.addEventListener('mouseover',e=>{if(S.v!=='margin')return;const n=e.target.closest('.note'),d=e.target.closest('.dl');document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));
 if(n){const [fi,a]=n.dataset.note.split(':').map(Number);hot(fi,a,true)}else if(d&&d.dataset.n){const nt=noteFor(+d.dataset.fi,+d.dataset.n);if(nt)hot(+d.dataset.fi,nt.a,true)}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'){if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))addComment();if(e.key==='Escape'){S.form=null;render()}return}
 if(e.key==='e'||e.key==='E'){if(S.v!=='spot'){S.ai=!S.ai;render()}}
 if(S.v==='spot'){if(e.key==='l'||e.key==='L'){S.spotOn=!S.spotOn;S.spotI=0;render()}
  if(S.spotOn&&(e.key==='ArrowRight'||e.key==='n')){S.spotI++;render()}if(S.spotOn&&(e.key==='ArrowLeft'||e.key==='p')){S.spotI=Math.max(0,S.spotI-1);render()}if(e.key==='Escape'&&S.spotOn){S.spotOn=false;render()}}
 if((e.key==='h'||e.key==='H')&&S.v==='graph'){document.querySelector('.modal')?.remove();graphModal(curFi())}
 if(e.key==='Escape')document.querySelector('.modal')?.remove();
 if(e.key==='c'&&S.sel){S.form=S.sel;S.kind=0;render();e.preventDefault()}
 if(e.key==='Escape')closeDrawer()});
window.addEventListener('resize',()=>{if(S.v==='margin')FILES.forEach((f,fi)=>placeNotes(fi))});
render();
</script>
</body>
</html>
