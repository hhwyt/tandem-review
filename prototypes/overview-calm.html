<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tandem Overview</title>
<style>
:root{--bg:#faf9f5;--surface:#fff;--surface2:#f5f4ed;--line:#e6e3d8;--text:#141413;--dim:#7a786f;--accent:#c96442;--adds:#4f7d3c;--dels:#b0503a;--fn:#5b5bb5;
 --line2:color-mix(in srgb,var(--line) 55%,var(--bg));--text2:color-mix(in srgb,var(--text) 78%,var(--bg));
 --accent-ink:color-mix(in srgb,var(--accent) 85%,var(--text));--accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));--accent-line:color-mix(in srgb,var(--accent) 38%,var(--surface));
 --add:color-mix(in srgb,var(--adds) 9%,var(--surface));--t2:color-mix(in srgb,var(--accent) 55%,var(--text));
 --e1:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);--e2:0 2px 4px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.08);
 --serif:"Tiempos Headline","Iowan Old Style","Charter","Georgia","Songti SC",serif;--sans:-apple-system,BlinkMacSystemFont,"Inter","PingFang SC",sans-serif;--mono:"SF Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}a{color:var(--accent-ink)}
.top{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font:600 17px var(--serif);display:flex;gap:6px;align-items:center}.brand b{color:var(--accent)}
.vt{display:flex;gap:4px;margin-left:10px}.vt button{border:1px solid transparent;background:none;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--dim)}
.vt button.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 14px;cursor:pointer;font-size:13px;transition:box-shadow .15s,transform .15s}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff}.btn.go:hover{box-shadow:var(--e2)}
.seg{display:flex;background:var(--surface2);border-radius:8px;padding:2px}.seg button{border:0;background:none;height:26px;padding:0 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--dim)}.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--e1)}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.h1{font:500 30px/1.25 var(--serif);letter-spacing:-.015em;margin:6px 0 12px}
.lede{font:17px/1.65 var(--serif);color:var(--text2);margin:0}
h2{font:500 19px var(--serif);margin:0 0 12px;display:flex;align-items:baseline;gap:10px}h2 small{font:13px var(--sans);color:var(--dim)}
.sec{margin-top:36px;scroll-margin-top:70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--e1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dcard{display:block;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;box-shadow:var(--e1);cursor:pointer;transition:box-shadow .18s,transform .18s}
.dcard:hover{box-shadow:var(--e2);transform:translateY(-1px)}
.dcard .row{display:flex;align-items:center;gap:8px}
.tag{font-size:11px;line-height:18px;padding:0 7px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.golink{font:11.5px var(--mono);color:var(--accent-ink);border-bottom:1px dashed var(--accent-line)}.dcard:hover .golink{border-bottom-style:solid}
.dcard .q{font-weight:600;margin:6px 0 2px;line-height:1.45}.dcard .n{color:var(--dim);font-size:13px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;display:flex;gap:10px;padding:5px 0}
.steps li:before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface2);font:600 12px/22px var(--sans);text-align:center;color:var(--text2)}
.cov{list-style:none;margin:0;padding:0}.cov li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)}.cov li:last-child{border:0}.cov b{width:16px;text-align:center}
.ftab{width:100%;border-collapse:collapse;font-size:13.5px}.ftab td{padding:7px 8px;border-top:1px solid var(--line2);vertical-align:top}.mono{font-family:var(--mono);font-size:12.5px}
.pn{color:var(--adds);font-weight:600}.mn{color:var(--dels);font-weight:600}
.foot{display:flex;justify-content:flex-end;margin-top:36px}
/* diagram behaviour shared */
.gnode{cursor:pointer}.gnode rect{transition:stroke-width .15s,filter .15s}.gnode:hover rect{stroke-width:2.4;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}.garrow{fill:var(--accent);opacity:.75}.gnode.sel rect{stroke-width:2.6}
.flowdash{stroke-dasharray:4 6;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}
/* V1 report */
.w1{max-width:900px;margin:0 auto;padding:36px 28px 80px}
.bgart{position:fixed;right:28px;bottom:20px;width:420px;aspect-ratio:260/120;z-index:0;pointer-events:none;opacity:.13;color:var(--text)}
.bgart svg{width:100%;height:100%;display:block}
#main{position:relative;z-index:1}
.banner{height:120px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-bottom:24px;position:relative;box-shadow:var(--e1)}
.banner svg{width:100%;height:100%}
.banner .pause{position:absolute;right:10px;bottom:8px;font-size:11.5px;color:var(--dim);cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 7px}
/* V2 guide */
.w2{max-width:1120px;margin:0 auto;padding:36px 28px 80px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px}
.toc{position:sticky;top:76px;align-self:start;font-size:13.5px}
.toc a{display:block;padding:6px 12px;color:var(--dim);text-decoration:none;border-left:2px solid var(--line);transition:color .15s,border-color .15s}
.toc a.on{color:var(--text);border-left-color:var(--accent);font-weight:600}
.toc .pg{height:3px;border-radius:2px;background:var(--line);margin:14px 0 6px;overflow:hidden}.toc .pg i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* V3 decisions first */
.w3{max-width:920px;margin:0 auto;padding:36px 28px 80px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--e1);margin-bottom:10px}
.chk .opts{display:flex;gap:6px;flex:none}
.chk .opts button{height:26px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 9px;font-size:12px;cursor:pointer;color:var(--dim)}
.chk .opts button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chk.done{background:var(--surface2)}
.chk .mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:background .2s,border-color .2s}
.chk.done .mark{background:var(--adds);border-color:var(--adds)}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);margin:6px 0 14px}.meter .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.meter .bar i{display:block;height:100%;background:var(--adds);transition:width .3s}
/* V4 diagram first */
.w4{max-width:1180px;margin:0 auto;padding:30px 28px 80px}
.dgwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.insp{position:sticky;top:76px}
.insp .empty{color:var(--dim);font-size:13.5px}
.insp h3{font:500 17px var(--serif);margin:0 0 6px}
/* V5 dashboard */
.w5{max-width:1180px;margin:0 auto;padding:30px 28px 80px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--e1)}
.tile .v{font:600 26px var(--serif)}.tile .k{font-size:12px;color:var(--dim)}
.g5{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:16px}
.span6{grid-column:span 6}.span12{grid-column:span 12}.span4{grid-column:span 4}.span8{grid-column:span 8}
.ghlink{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--dim);background:var(--surface);transition:color .15s,border-color .15s}.ghlink:hover{color:var(--text);border-color:var(--dim);text-decoration:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){.grid2,.w2,.dgwrap,.tiles{grid-template-columns:1fr}.toc,.insp{position:static}.span6,.span4,.span8{grid-column:span 12}}
</style>
</head>
