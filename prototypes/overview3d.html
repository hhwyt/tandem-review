<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tandem Overview 3D</title>
<style>
:root{--bg:#faf9f5;--surface:#fff;--surface2:#f5f4ed;--line:#e6e3d8;--text:#141413;--dim:#7a786f;--accent:#c96442;--adds:#4f7d3c;--dels:#b0503a;--fn:#5b5bb5;
 --soft:color-mix(in srgb,var(--accent) 12%,var(--surface));--aline:color-mix(in srgb,var(--accent) 40%,var(--surface));--glow:color-mix(in srgb,var(--accent) 55%,transparent);
 --serif:"Tiempos Headline","Iowan Old Style","Charter","Georgia","Songti SC",serif;--sans:-apple-system,BlinkMacSystemFont,"Inter","PingFang SC",sans-serif;--mono:"SF Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font:600 17px var(--serif);display:flex;gap:6px;align-items:center}.brand b{color:var(--accent);display:inline-block;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vt{display:flex;gap:4px;margin-left:10px}.vt button{border:1px solid transparent;background:none;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--dim)}
.vt button.on{border-color:var(--aline);background:var(--soft);color:var(--accent)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 14px;cursor:pointer;font-size:13px}
.btn.go{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 24px var(--glow)}
.btn.go:hover{transform:translateY(-1px)}
.seg{display:flex;background:var(--surface2);border-radius:8px;padding:2px}.seg button{border:0;background:none;height:26px;padding:0 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--dim)}.seg button.on{background:var(--surface);color:var(--text)}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.h1{font:500 34px/1.2 var(--serif);letter-spacing:-.02em;margin:8px 0 12px}
.lede{font:17px/1.65 var(--serif);color:color-mix(in srgb,var(--text) 80%,var(--bg));max-width:760px}
.wrap{max-width:1160px;margin:0 auto;padding:36px 28px 80px;position:relative;z-index:1}
h2{font:500 20px var(--serif);margin:42px 0 14px}
.dec{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dc{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;transform-style:preserve-3d;transition:transform .2s ease,box-shadow .2s;will-change:transform}
.dc:hover{box-shadow:0 18px 40px rgba(0,0,0,.12),0 0 0 1px var(--aline)}
.dc .tg{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 7px;color:var(--dim)}
.dc .q{font-weight:600;margin:6px 0 2px;transform:translateZ(24px)}
.dc .n{color:var(--dim);font-size:13px;transform:translateZ(14px)}
.dc .to{position:absolute;right:14px;top:12px;font:11.5px var(--mono);color:var(--accent)}
.dc:before{content:"";position:absolute;inset:0;border-radius:14px;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 40%);opacity:0;transition:opacity .2s;pointer-events:none;mix-blend-mode:soft-light}
.dc:hover:before{opacity:1}
.cov{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;list-style:none;padding:0;margin:0}
.cov li{display:flex;gap:10px}.cov b{width:16px;text-align:center}
.foot{display:flex;justify-content:flex-end;margin-top:36px}
/* ---------- V1 isometric ---------- */
.iso{height:440px;perspective:1600px;display:flex;align-items:center;justify-content:center;margin:10px 0 -40px}
.iso .plane{transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-38deg);animation:isoFloat 7s ease-in-out infinite}
@keyframes isoFloat{0%,100%{transform:rotateX(58deg) rotateZ(-38deg) translateZ(0)}50%{transform:rotateX(58deg) rotateZ(-34deg) translateZ(18px)}}
.lane{position:relative;display:flex;gap:46px;margin:34px 0;transform-style:preserve-3d}
.lane .lt{position:absolute;left:-10px;top:-26px;font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:700}
.blk{position:relative;width:150px;height:86px;transform-style:preserve-3d;transform:translateZ(var(--h,26px));cursor:default;transition:transform .25s}
.blk .f{position:absolute;inset:0;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.35}
.blk .f small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:2px}
.blk:before,.blk:after{content:"";position:absolute;background:color-mix(in srgb,var(--line) 70%,var(--text) 8%)}
.blk:before{left:0;right:0;bottom:0;height:var(--h,26px);transform-origin:bottom;transform:rotateX(-90deg);border-radius:0 0 6px 6px}
.blk:after{top:0;bottom:0;right:0;width:var(--h,26px);transform-origin:right;transform:rotateY(90deg);background:color-mix(in srgb,var(--line) 85%,var(--text) 12%)}
.blk.new .f{background:var(--soft);border-color:var(--accent)}
.blk.new:before,.blk.new:after{background:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.blk.mod .f{border:1.5px dashed var(--accent)}
.blk.go{cursor:pointer}.blk.go:hover{transform:translateZ(calc(var(--h,26px) + 22px))}
.wire{position:absolute;height:3px;top:42px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:200% 100%;animation:wire 1.6s linear infinite;opacity:.8}
@keyframes wire{from{background-position:100% 0}to{background-position:-100% 0}}
/* ---------- V2 orbit ---------- */
.orbitHero{position:relative;height:420px;margin:-10px 0 10px}
.orbitHero canvas{position:absolute;inset:0;width:100%;height:100%}
.orbitHero .lbl{position:absolute;left:0;bottom:16px;font-size:12px;color:var(--dim)}
/* ---------- V3 strata ---------- */
.strata{height:620px;perspective:1400px;display:flex;align-items:center;justify-content:center;margin-top:60px}
.stack{position:relative;width:560px;height:300px;transform-style:preserve-3d;animation:stackRot 18s ease-in-out infinite}
@keyframes stackRot{0%,100%{transform:rotateX(62deg) rotateZ(-30deg)}50%{transform:rotateX(58deg) rotateZ(-50deg)}}
.layer{position:absolute;inset:0;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 75%,transparent);transform-style:preserve-3d;box-shadow:0 30px 60px rgba(0,0,0,.08)}
.layer .ln{position:absolute;left:16px;top:12px;font:600 13px var(--sans);color:var(--dim);letter-spacing:.06em}
.node{position:absolute;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);white-space:nowrap;transform:translateZ(2px)}
.node.new{background:var(--soft);border-color:var(--accent);box-shadow:0 0 24px var(--glow);animation:pulse 2.4s ease-in-out infinite}
.node.mod{border:1.5px dashed var(--accent)}
.node.go{cursor:pointer}
@keyframes pulse{50%{box-shadow:0 0 6px var(--glow)}}
.beam{position:absolute;width:2px;background:linear-gradient(var(--accent),transparent);transform-origin:top;opacity:.7}
/* ---------- V4 HUD ---------- */
.hudbg{position:fixed;inset:52px 0 0 0;z-index:0;pointer-events:none}
.hud{position:relative;border:1px solid var(--aline);border-radius:4px;padding:18px 20px;background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(4px)}
.hud:before,.hud:after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--accent)}
.hud:before{left:-2px;top:-2px;border-right:0;border-bottom:0}.hud:after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.hud .scan{position:absolute;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--glow),transparent);opacity:.25;animation:scan 4s linear infinite;pointer-events:none}
@keyframes scan{from{top:-40px}to{top:100%}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.stat .v{font:600 34px var(--mono);color:var(--accent);letter-spacing:-.02em}
.stat .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.radar{width:100%;height:240px}
/* ---------- V5 carousel ---------- */
.stage{height:520px;perspective:1600px;display:flex;align-items:center;justify-content:center;margin-top:10px}
.car{position:relative;width:420px;height:340px;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.panel{position:absolute;inset:0;border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:22px 24px;box-shadow:0 30px 60px rgba(0,0,0,.12);backface-visibility:hidden;overflow:auto;cursor:pointer}
.panel h3{font:500 20px var(--serif);margin:0 0 10px}
.panel.front{border-color:var(--accent);box-shadow:0 30px 70px rgba(0,0,0,.18),0 0 0 1px var(--aline),0 0 50px var(--glow)}
.dots{display:flex;gap:8px;justify-content:center;margin-top:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer}.dots i.on{background:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){.dec,.cov,.stats{grid-template-columns:1fr}.iso,.strata,.stage{transform:scale(.6);transform-origin:center}}
</style>
</head>
<body>
<div class="top"><span class="brand"><b>✦</b>Tandem</span><div class="vt" id="vt"></div><span class="sp"></span><div class="seg" id="lang"></div><button class="btn go" id="start"></button></div>
<canvas class="hudbg" id="hudbg" style="display:none"></canvas>
<div id="main"></div>
<script>
const T=(en,zh)=>({en,zh});const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const S={v:'iso',lang:'en',skin:'claude',ci:0};try{S.lang=localStorage.getItem('hr-lang')||'en';S.v=localStorage.getItem('hr-ov3d')||'iso'}catch(_){}
const L=o=>o==null?'':typeof o==='string'?o:(o[S.lang]??o.en);
const SKINS={
 claude:{n:'Claude',bg:'#faf9f5',surface:'#ffffff',surface2:'#f5f4ed',line:'#e6e3d8',text:'#141413',dim:'#7a786f',accent:'#c96442',adds:'#4f7d3c',dels:'#b0503a',kw:'#a9502f',str:'#4f7d3c',fn:'#5b5bb5',com:'#9a978c'},
 paper:{n:'Paper',bg:'#ffffff',surface:'#ffffff',surface2:'#f6f8fa',line:'#d0d7de',text:'#1f2328',dim:'#656d76',accent:'#0969da',adds:'#1a7f37',dels:'#cf222e',kw:'#cf222e',str:'#0a3069',fn:'#8250df',com:'#6e7781'},
 ocean:{n:'Ocean',bg:'#f4f8fb',surface:'#ffffff',surface2:'#eaf1f7',line:'#d4e0ea',text:'#13293d',dim:'#5d7287',accent:'#1f7a8c',adds:'#2a8f6a',dels:'#c0504d',kw:'#1f6f99',str:'#2a8f6a',fn:'#7a4fb0',com:'#8ca0b3'},
 forest:{n:'Forest',bg:'#f5f7f2',surface:'#ffffff',surface2:'#eef2ea',line:'#dbe2d3',text:'#1c2a1e',dim:'#6b7a69',accent:'#3f7d4e',adds:'#3f7d4e',dels:'#b5523b',kw:'#7a5a1f',str:'#3f7d4e',fn:'#5b6db5',com:'#93a08f'},
 rose:{n:'Rosé',bg:'#fdf7f7',surface:'#ffffff',surface2:'#f9eeee',line:'#efdcdc',text:'#2d1b1f',dim:'#87696e',accent:'#c2456a',adds:'#4b8a5f',dels:'#c2456a',kw:'#a33a5a',str:'#4b8a5f',fn:'#6a5acd',com:'#ab9499'},
 sand:{n:'Sand',bg:'#fbf6ec',surface:'#fffdf8',surface2:'#f4ecdc',line:'#e8dcc4',text:'#2b2418',dim:'#857a63',accent:'#b07d12',adds:'#5d7f2f',dels:'#b4492e',kw:'#9a5b12',str:'#5d7f2f',fn:'#5866b0',com:'#a89c84'},
 graphite:{n:'Graphite',dark:1,bg:'#1c1c1e',surface:'#242426',surface2:'#2c2c2f',line:'#3a3a3d',text:'#ececec',dim:'#9a9a9f',accent:'#e5a442',adds:'#7fbf6e',dels:'#e57373',kw:'#e5a442',str:'#9fd38a',fn:'#9ab4ff',com:'#7d7d82',hl:'#e5a442'},
 nord:{n:'Nord',dark:1,bg:'#2e3440',surface:'#353c4a',surface2:'#3b4252',line:'#4c566a',text:'#eceff4',dim:'#a3acbd',accent:'#88c0d0',adds:'#a3be8c',dels:'#bf616a',kw:'#81a1c1',str:'#a3be8c',fn:'#b48ead',com:'#7b8496',hl:'#ebcb8b'},
 midnight:{n:'Midnight',dark:1,bg:'#0f1420',surface:'#151c2b',surface2:'#1b2335',line:'#28324a',text:'#e6ebf5',dim:'#8b96ad',accent:'#5eb3ff',adds:'#58c48a',dels:'#ff6b81',kw:'#c792ea',str:'#58c48a',fn:'#82aaff',com:'#5f6b85',hl:'#5eb3ff'},
 violet:{n:'Violet Night',dark:1,bg:'#1d1a26',surface:'#24202f',surface2:'#2b2638',line:'#3b3450',text:'#f2eefc',dim:'#a49bbd',accent:'#b392f0',adds:'#7ee0a1',dels:'#ff7aa2',kw:'#ff79c6',str:'#f1fa8c',fn:'#8be9fd',com:'#6e6488',hl:'#b392f0'}};
function applySkin(k){const s=SKINS[k]||SKINS.claude;const r=document.documentElement.style;['bg','surface','surface2','line','text','dim','accent','adds','dels','kw','str','fn','com'].forEach(x=>r.setProperty('--'+x,s[x]));r.setProperty('--hl',s.hl||'#f5c400');r.setProperty('--shadow',s.dark?'0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35)':'0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06)');document.documentElement.style.colorScheme=s.dark?'dark':'light';S.skin=k;try{localStorage.setItem('hr-skin',k)}catch(_){}}

const M={
 title:T('Storage class: INTERVAL selector for partition tiers','存储档位：用 INTERVAL 选择分区档位'),
 verdict:T('Lets an IA rule say “older than 3 years” instead of a fixed date, and keeps it moving with a periodic DDL-owner job. The direction is sound; one rolling-upgrade question and three behavior choices need your call.','让 IA 规则可以写「早于 3 年前」而不是固定日期，并由 DDL owner 定期重算，让这条线随时间往前走。方向没问题；一个滚动升级问题和三个行为取舍要你拍板。'),
 bg:T('Storage class rules move old partitions to cheaper IA storage. A less_than selector is a fixed boundary, and tiers are computed only when a DDL touches the table, so “3 years ago” written as a date never moves.','storage class 规则把老分区放到更便宜的 IA 存储。less_than 选择器是固定边界，档位只在 DDL 碰到表时才算，所以写成日期的「三年前」永远不会动。'),
 design:[T('At statement time, INTERVAL n UNIT becomes the literal it stands for at now (UTC) and matches exactly like a literal.','语句执行时，INTERVAL n UNIT 换算成「现在（UTC）」对应的固定值，按固定值规则匹配。'),
  T('Every period, the DDL owner re-evaluates partitioned tables and submits an ALTER job where partitions newly cross the cutoff.','每个周期，DDL owner 重算分区表，有分区新越线就提交 ALTER job。'),
  T('The job re-checks when it runs: skip if the rule changed meanwhile, apply only STANDARD→IA.','job 执行时再查一遍：规则中途变了就跳过，只允许 STANDARD→IA。')],
 cover:[['✓',T('RANGE COLUMNS(DATE / DATETIME), RANGE(TO_DAYS(col)), RANGE(UNIX_TIMESTAMP(col))','RANGE COLUMNS(DATE / DATETIME)、RANGE(TO_DAYS(col))、RANGE(UNIX_TIMESTAMP(col))')],
  ['✓',T('CREATE TABLE, ALTER ENGINE_ATTRIBUTE, ADD / REORGANIZE PARTITION','CREATE TABLE、ALTER ENGINE_ATTRIBUTE、ADD / REORGANIZE PARTITION')],
  ['✗',T('Tiers other than IA, or combined with transitions','IA 以外的档位，或和 transitions 一起用')],
  ['✗',T('Moving partitions back from IA to STANDARD','把分区从 IA 挪回 STANDARD')],
  ['!',T('CREATE TABLE … LIKE copies the rule without the partition-key check','CREATE TABLE … LIKE 复制规则时不做分区键检查')],
  ['!',T('Classic kernel: jobs change metadata but stage no TiKV transition','经典内核：job 会改元数据，但不排 TiKV 迁移')]],
 decide:[[T('Compat','兼容'),T('What does an older DDL owner do with a recalculation job during a rolling upgrade?','滚动升级时，老版本 DDL owner 拿到重算 job 会怎么处理？'),T('Unverified. Old decoders read only the first argument.','未验证。老版本只解第一个参数。'),['exec',139]],
  [T('Behavior','行为'),T('If the clock goes back, the whole table is skipped with a Warn and a metric.','时钟回拨时，整张表跳过，打 Warn 和指标。'),T('Alternative: apply only the STANDARD→IA part.','另一种：只应用 STANDARD→IA 的部分。'),['recalc',250]],
  [T('Design','设计'),T('Default period 24h, floor 10m, cutoff in UTC.','默认周期 24h，下限 10m，截止时间按 UTC。'),T('A partition can lag up to one period.','分区最多晚一个周期转 IA。'),['cutoff',93]],
  [T('Scope','范围'),T('IA only, no transitions.','只支持 IA，不支持 transitions。'),T('Keeps the gate simple.','让闸保持简单。'),['gate',117]]]
};

const sec={check:1,parse:2,convert:3,cutoff:4,round:5,recalc:6,exec:7,gate:8};
const go=(g)=>{location.href='app.html'+location.search+'#go='+g};
const NODES=[ // lane, label, sub, kind, target
 [0,T('CREATE / ALTER','CREATE / ALTER'),T('user DDL','用户 DDL'),'same',null],
 [0,T('Admission check','准入检查'),T('reject unsupported key','拒绝不支持的分区键'),'mod','check:213'],
 [0,T('Compute tiers','计算分区档位'),T('INTERVAL → literal','INTERVAL → 固定值'),'mod','convert:169'],
 [0,T('Partition tier','分区档位'),T('table metadata','表元数据'),'same',null],
 [1,T('Owner loop','owner 循环'),T('every 24h','每 24h'),'new','round:188'],
 [1,T('Re-evaluate','重算分区表'),T('read only','只算不改'),'new','recalc:246'],
 [1,T('Submit job','提交 job'),T('recalc flag','重算标记'),'new','recalc:257'],
 [1,T('Execute job','执行 job'),T('two gates','两道闸'),'mod','exec:139'],
 [1,T('TiKV','TiKV 迁移'),T('next-gen','next-gen'),'same',null]];
const LANES=[T('STATEMENT TIME','语句执行时'),T('EVERY PERIOD · NEW','每个周期 · 新增')];
function decHTML(){return `<h2>${L(T('Needs your call','需要你拍板'))}</h2><div class="dec">${M.decide.map(([t,q,n,g])=>`<div class="dc tilt" data-go="${g[0]}:${g[1]}"><span class="tg">${esc(L(t))}</span><span class="to">§${sec[g[0]]} → </span><div class="q">${esc(L(q))}</div><div class="n">${esc(L(n))}</div></div>`).join('')}</div>`}
function covHTML(){return `<h2>${L(T('Boundary','改动边界'))}</h2><ul class="cov">${M.cover.map(([m,t])=>`<li><b style="color:${m==='✓'?'var(--adds)':m==='✗'?'var(--dels)':'var(--accent)'}">${m}</b><span>${esc(L(t))}</span></li>`).join('')}</ul>`}
function headHTML(){return `<div class="eyebrow">${L(T('Summary','总结'))}</div><div class="h1">${esc(L(M.title))}</div><p class="lede">${esc(L(M.verdict))}</p>`}
function bgHTML(){return `<h2>${L(T('Background & approach','背景与做法'))}</h2><p class="lede" style="font-size:15px">${esc(L(M.bg))}</p><ol class="lede" style="font-size:15px">${M.design.map(d=>`<li>${esc(L(d))}</li>`).join('')}</ol>`}
const footHTML=()=>`<div class="foot"><button class="btn go" data-start="1" style="height:42px;padding:0 24px;font-size:14px">${L(T('Start review','开始 review'))} →</button></div>`;
const V={
iso(){let lanes=[0,1].map(l=>`<div class="lane"><span class="lt">${esc(L(LANES[l]))}</span>${NODES.filter(n=>n[0]===l).map((n,i)=>`<div class="blk ${n[3]} ${n[4]?'go':''}" ${n[4]?`data-go="${n[4]}"`:''} style="--h:${n[3]==='new'?34:n[3]==='mod'?26:14}px"><div class="f">${esc(L(n[1]))}<small>${esc(L(n[2]))}</small></div></div>`).join('')}${[0,1,2,3].slice(0,NODES.filter(n=>n[0]===l).length-1).map(i=>`<div class="wire" style="left:${150+i*196}px;width:46px"></div>`).join('')}</div>`).join('');
 return `<div class="wrap">${headHTML()}<div class="iso"><div class="plane">${lanes}</div></div>${decHTML()}${covHTML()}${bgHTML()}${footHTML()}</div>`},
orbit(){return `<div class="wrap">${headHTML()}<div class="orbitHero"><canvas id="orb"></canvas><div class="lbl">${L(T('Core: the interval rule · inner ring: statement-time path · outer ring: periodic path · dust: 18 files','中心：interval 规则 · 内环：语句执行时路径 · 外环：周期重算路径 · 粒子：18 个文件'))}</div></div>${decHTML()}${covHTML()}${bgHTML()}${footHTML()}</div>`},
strata(){const layers=[[T('SQL layer','SQL 层'),[['CREATE / ALTER','same',null,40,60],['Admission check','mod','check:213',220,60]]],[T('DDL owner','DDL owner'),[['Owner loop','new','round:188',40,70],['Re-evaluate','new','recalc:246',200,70],['Submit job','new','recalc:257',360,70]]],[T('DDL job execution','DDL job 执行'),[['Compute tiers','mod','convert:169',60,80],['Two gates','mod','exec:139',260,80]]],[T('Storage (TiKV)','存储（TiKV）'),[['IA transition','same',null,200,90]]]];
 const h=layers.map(([n,ns],i)=>`<div class="layer" style="transform:translateZ(${(3-i)*90}px)"><span class="ln">${esc(L(n))}</span>${ns.map(([t,k,g,x,y])=>`<div class="node ${k} ${g?'go':''}" ${g?`data-go="${g}"`:''} style="left:${x}px;top:${y+30}px">${esc(t)}</div>`).join('')}</div>`).join('')+[[120,90],[260,90],[300,180]].map(([x,z])=>`<div class="beam" style="left:${x}px;top:150px;height:${z}px;transform:rotateX(-90deg) translateZ(-${z}px)"></div>`).join('');
 return `<div class="wrap">${headHTML()}<div class="strata"><div class="stack">${h}</div></div>${decHTML()}${covHTML()}${bgHTML()}${footHTML()}</div>`},
hud(){return `<div class="wrap">${headHTML()}<div class="hud" style="margin-top:22px"><div class="scan"></div><div class="stats">${[['18',T('files','文件')],['1508',T('lines added','新增行')],['8',T('functions to read','要读的函数')],['4',T('decisions','待拍板')]].map(([v,k])=>`<div class="stat"><div class="v" data-count="${v}">0</div><div class="k">${esc(L(k))}</div></div>`).join('')}</div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px"><div class="hud"><div class="scan"></div><div class="eyebrow">${L(T('Risk radar','风险雷达'))}</div><canvas class="radar" id="radar"></canvas></div><div class="hud"><div class="scan"></div><div class="eyebrow">${L(T('Pipeline','流水线'))}</div><canvas class="radar" id="pipe"></canvas></div></div>${decHTML()}${covHTML()}${bgHTML()}${footHTML()}</div>`},
deck(){const P=[[T('Summary','总结'),`<p>${esc(L(M.verdict))}</p>`],[T('Needs your call','需要你拍板'),M.decide.map(([t,q,n,g])=>`<p data-go="${g[0]}:${g[1]}" style="cursor:pointer"><b>${esc(L(t))}</b> · ${esc(L(q))} <span style="color:var(--accent)">§${sec[g[0]]} →</span></p>`).join('')],[T('Background','背景'),`<p>${esc(L(M.bg))}</p>`],[T('Approach','做法'),`<ol>${M.design.map(d=>`<li>${esc(L(d))}</li>`).join('')}</ol>`],[T('Boundary','改动边界'),M.cover.map(([m,t])=>`<p><b>${m}</b> ${esc(L(t))}</p>`).join('')]];
 const n=P.length,r=Math.round(420/2/Math.tan(Math.PI/n))+60;
 return `<div class="wrap">${headHTML()}<div class="stage"><div class="car" id="car" data-r="${r}">${P.map(([h,b],i)=>`<div class="panel" data-pi="${i}" style="transform:rotateY(${i*360/n}deg) translateZ(${r}px)"><h3>${esc(L(h))}</h3>${b}</div>`).join('')}</div></div><div class="dots">${P.map((_,i)=>`<i data-pi="${i}"></i>`).join('')}</div>${footHTML()}</div>`}
};
let raf=0,timers=[];
function stopAnims(){cancelAnimationFrame(raf);timers.forEach(clearInterval);timers=[];document.getElementById('hudbg').style.display='none'}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return [x,r.width,r.height]}
function orbit(){const c=document.getElementById('orb');if(!c)return;let [x,W,H]=fit(c);const acc=css('--accent'),dim=css('--dim'),txt=css('--text');
 const rings=[{r:110,tilt:.35,n:4,labels:['check','parse','convert','cutoff'],sp:.6},{r:190,tilt:.25,n:4,labels:['runRound','recalcTable','execute','gate'],sp:-.35}];
 const dust=Array.from({length:18},(_,i)=>({a:Math.random()*6.28,r:240+Math.random()*60,y:(Math.random()-.5)*60,s:.1+Math.random()*.2}));let t=0;
 function f(){t+=.008;x.clearRect(0,0,W,H);const cx=W/2,cy=H/2;
  const g=x.createRadialGradient(cx,cy,4,cx,cy,70);g.addColorStop(0,acc);g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(cx,cy,70,0,7);x.fill();
  x.fillStyle=txt;x.font='600 13px '+css('--mono');x.textAlign='center';x.fillText('INTERVAL',cx,cy+4);
  dust.forEach(d=>{const a=d.a+t*d.s;const px=cx+Math.cos(a)*d.r,py=cy+Math.sin(a)*d.r*.3+d.y;x.globalAlpha=.35+.3*Math.sin(a);x.fillStyle=dim;x.beginPath();x.arc(px,py,2.2,0,7);x.fill()});x.globalAlpha=1;
  rings.forEach((R,ri)=>{x.strokeStyle=acc;x.globalAlpha=.35;x.lineWidth=1;x.beginPath();x.ellipse(cx,cy,R.r,R.r*R.tilt,0,0,7);x.stroke();x.globalAlpha=1;
   R.labels.forEach((lb,i)=>{const a=t*R.sp+i*6.283/R.n;const px=cx+Math.cos(a)*R.r,py=cy+Math.sin(a)*R.r*R.tilt;const z=Math.sin(a);const s=4+2*z;x.globalAlpha=.55+.45*(z+1)/2;x.fillStyle=acc;x.beginPath();x.arc(px,py,s,0,7);x.fill();x.fillStyle=txt;x.font=(11+z)+'px '+css('--mono');x.fillText(lb,px,py-10);x.globalAlpha=1})});
  raf=requestAnimationFrame(f)}f()}
function hud(){const bg=document.getElementById('hudbg');bg.style.display='block';let [x,W,H]=fit(bg);const acc=css('--accent');let t=0;
 function f(){t+=.6;x.clearRect(0,0,W,H);x.strokeStyle=acc;const hz=H*.45;for(let i=0;i<26;i++){const p=((i*30+t)%780)/780;const y=hz+Math.pow(p,2.2)*(H-hz);x.globalAlpha=p*.18;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  for(let i=-20;i<=20;i++){x.globalAlpha=.08;x.beginPath();x.moveTo(W/2+i*20,hz);x.lineTo(W/2+i*160,H);x.stroke()}x.globalAlpha=1;raf=requestAnimationFrame(f);radar();pipe()}
 document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;let v=0;const id=setInterval(()=>{v=Math.min(to,v+Math.ceil(to/40));el.textContent=v;if(v>=to)clearInterval(id)},30);timers.push(id)});
 const rc=document.getElementById('radar'),pc=document.getElementById('pipe');const [rx,RW,RH]=fit(rc),[px,PW,PH]=fit(pc);let a=0;
 const axes=[T('Compat','兼容'),T('Behavior','行为'),T('Design','设计'),T('Scope','范围'),T('Tests','测试')],vals=[.85,.6,.4,.3,.25];
 function radar(){a+=.02;rx.clearRect(0,0,RW,RH);const cx=RW/2,cy=RH/2+6,R=Math.min(RW,RH)/2-24;rx.strokeStyle=css('--line');for(let k=1;k<=4;k++){rx.beginPath();for(let i=0;i<=5;i++){const g=-Math.PI/2+i*6.283/5;rx.lineTo(cx+Math.cos(g)*R*k/4,cy+Math.sin(g)*R*k/4)}rx.stroke()}
  rx.fillStyle=css('--accent');rx.globalAlpha=.25;rx.beginPath();vals.forEach((v,i)=>{const g=-Math.PI/2+i*6.283/5;rx.lineTo(cx+Math.cos(g)*R*v,cy+Math.sin(g)*R*v)});rx.fill();rx.globalAlpha=1;
  rx.fillStyle=css('--dim');rx.font='11px '+css('--sans');rx.textAlign='center';axes.forEach((l,i)=>{const g=-Math.PI/2+i*6.283/5;rx.fillText(L(l),cx+Math.cos(g)*(R+14),cy+Math.sin(g)*(R+14)+4)});
  const sw=rx.createConicGradient?rx.createConicGradient(a,cx,cy):null;if(sw){sw.addColorStop(0,css('--glow')||'rgba(200,100,66,.4)');sw.addColorStop(.12,'transparent');sw.addColorStop(1,'transparent');rx.fillStyle=sw;rx.beginPath();rx.arc(cx,cy,R,0,7);rx.fill()}}
 let pt=0;function pipe(){pt+=.01;px.clearRect(0,0,PW,PH);const st=['owner','re-eval','submit','gates','TiKV'];const y=PH/2,gap=(PW-60)/(st.length-1);px.strokeStyle=css('--line');px.lineWidth=2;px.beginPath();px.moveTo(30,y);px.lineTo(PW-30,y);px.stroke();
  st.forEach((s,i)=>{const X=30+i*gap;px.fillStyle=i<4?css('--accent'):css('--dim');px.beginPath();px.arc(X,y,7,0,7);px.fill();px.fillStyle=css('--dim');px.font='11px '+css('--mono');px.textAlign='center';px.fillText(s,X,y+24)});
  for(let k=0;k<3;k++){const p=(pt+k/3)%1;const X=30+p*(PW-60);px.fillStyle=css('--accent');px.globalAlpha=1-Math.abs(p-.5);px.beginPath();px.arc(X,y,4,0,7);px.fill();px.globalAlpha=1}}
 f()}
function deck(){const car=document.getElementById('car');if(!car)return;const n=car.children.length;const set=i=>{S.ci=(i+n)%n;car.style.transform=`translateZ(-${car.dataset.r}px) rotateY(${-S.ci*360/n}deg)`;car.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('front',j===S.ci));document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===S.ci))};set(S.ci);
 let hover=false;car.onmouseenter=()=>hover=true;car.onmouseleave=()=>hover=false;timers.push(setInterval(()=>{if(!hover)set(S.ci+1)},3500));window._deckSet=set}
function render(){stopAnims();document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';
 document.getElementById('vt').innerHTML=[['iso',T('1 Isometric','① 等轴立体')],['orbit',T('2 Orbit','② 轨道')],['strata',T('3 Strata','③ 分层')],['hud',T('4 HUD','④ 科幻面板')],['deck',T('5 Carousel','⑤ 旋转卡片')]].map(([k,n])=>`<button data-v="${k}" class="${S.v===k?'on':''}">${esc(L(n))}</button>`).join('');
 document.getElementById('lang').innerHTML=`<button data-lang="en" class="${S.lang==='en'?'on':''}">EN</button><button data-lang="zh" class="${S.lang==='zh'?'on':''}">中文</button>`;
 document.getElementById('start').textContent=L(T('Start review','开始 review'))+' →';
 document.getElementById('main').innerHTML=V[S.v]();({orbit,hud,deck}[S.v]||(()=>{}))()}
document.addEventListener('mousemove',e=>{const d=e.target.closest('.tilt');document.querySelectorAll('.tilt').forEach(x=>{if(x!==d)x.style.transform=''});if(!d)return;const r=d.getBoundingClientRect();const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;d.style.transform=`perspective(800px) rotateX(${(.5-py)*10}deg) rotateY(${(px-.5)*12}deg) translateZ(6px)`;d.style.setProperty('--mx',px*100+'%');d.style.setProperty('--my',py*100+'%')});
document.addEventListener('click',e=>{const c=x=>e.target.closest(x);
 if(c('[data-v]')){S.v=c('[data-v]').dataset.v;try{localStorage.setItem('hr-ov3d',S.v)}catch(_){}render();return}
 if(c('[data-lang]')){S.lang=c('[data-lang]').dataset.lang;try{localStorage.setItem('hr-lang',S.lang)}catch(_){}render();return}
 if(c('[data-go]')){go(c('[data-go]').dataset.go);return}
 if(c('#start')||c('[data-start]')){location.href='app.html'+location.search+'#code';return}
 if(c('[data-pi]')&&window._deckSet){window._deckSet(+c('[data-pi]').dataset.pi);return}});
window.addEventListener('resize',()=>render());
let sk=null;try{sk=localStorage.getItem('hr-skin')}catch(_){};const s=SKINS[sk]||SKINS.claude;['bg','surface','surface2','line','text','dim','accent','adds','dels','fn'].forEach(k=>document.documentElement.style.setProperty('--'+k,s[k]));document.documentElement.style.colorScheme=s.dark?'dark':'light';
render();
