<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 B · 命令面板 — PR 切换控件</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f6f8fa; --border:#d1d9e0; --text:#1f2328;
  --muted:#59636e; --blue:#0969da; --green:#1a7f37; --red:#d1242f; --yellow:#9a6700;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}

.topbar{height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg);position:relative;z-index:30}
.top-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;white-space:nowrap}
.brand .star{color:var(--blue)}
.tabs{display:flex;align-items:center;gap:20px;position:relative;height:56px;margin:0 auto}
.tab{background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);height:100%;padding:0 2px;display:flex;align-items:center;font-family:inherit}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);font-weight:600}
.tab-underline{position:absolute;bottom:0;height:2px;background:var(--blue);transition:left .2s ease,width .2s ease;border-radius:2px}
.top-right{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end}
.progress{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.btn-done{background:#000;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn-done:hover{background:#24292f}

/* switcher capsule */
.capsule{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg2);border-radius:999px;padding:6px 8px 6px 12px;cursor:pointer;max-width:420px}
.capsule:hover{border-color:#8b949e}
.capsule:focus{outline:2px solid var(--blue);outline-offset:1px}
.capsule-num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);white-space:nowrap}
.capsule-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capsule-kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 5px;white-space:nowrap}

/* overlay + palette */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:10vh}
.overlay.open{display:flex}
.palette{width:560px;max-width:92vw;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:10px;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.palette-search{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:15px;margin-bottom:8px;font-family:inherit}
.palette-search:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.palette-list{max-height:340px;overflow-y:auto;margin:0;padding:0;list-style:none}
.palette-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;cursor:pointer}
.palette-item:hover{background:var(--bg2)}
.palette-item.highlighted{background:var(--bg2);outline:2px solid var(--blue);outline-offset:-2px}
.avatar{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.pi-main{flex:1;min-width:0}
.pi-title{font-weight:600;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-meta{color:var(--muted);font-size:12px;margin-top:1px}
.pi-meta .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pi-right{width:92px;flex:none;text-align:right}
.pi-bar{height:5px;background:var(--bg2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-bottom:4px}
.pi-bar-fill{height:100%;background:var(--blue);border-radius:99px}
.pi-dec{font-size:11px;color:var(--muted)}
.empty{padding:18px;color:var(--muted);text-align:center}

.content{max-width:900px;margin:0 auto;padding:28px 24px 60px;transition:opacity .1s ease}
.content.fading{opacity:0}
h1.pr-title{font-size:22px;margin:0 0 10px;line-height:1.3}
.pr-summary{color:var(--muted);margin:0 0 16px}
.decide-link{color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer}
.decide-link:hover{text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;height:130px}
@media(max-width:720px){.cards{grid-template-columns:1fr}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2328;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s ease;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.pager{position:fixed;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:12px;z-index:60}
.pager a{color:var(--blue);text-decoration:none}
.pager a:hover{text-decoration:underline}
.pager .loc{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>
<body>
<header class="topbar">
  <div class="top-left">
    <span class="brand"><span class="star">✦</span> Tandem</span>
    <button class="capsule" id="capsule">
      <span class="capsule-num" id="capsuleNum"></span>
      <span class="capsule-title" id="capsuleTitle"></span>
      <span class="capsule-kbd">⌘K</span>
    </button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="code">代码</button>
    <span class="tab-underline" id="underline"></span>
  </nav>
  <div class="top-right">
    <span class="progress" id="progressText">12/30</span>
    <button class="btn-done" id="btnDone">完成</button>
  </div>
</header>

<main class="content" id="content">
  <h1 class="pr-title" id="prTitle"></h1>
  <p class="pr-summary" id="prSummary"></p>
  <a class="decide-link" id="decideLink" href="#"></a>
  <div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div></div>
</main>

<div class="overlay" id="overlay">
  <div class="palette" id="palette">
    <input class="palette-search" id="paletteSearch" type="text" placeholder="搜索或跳转到 PR…" autocomplete="off">
    <ul class="palette-list" id="paletteList"></ul>
  </div>
</div>

<nav class="pager">
  <a href="a-dropdown.html">← 上一个方案</a>
  <span class="loc">方案 2 / 5</span>
  <a href="c-rail.html">下一个方案 →</a>
</nav>

<div class="toast" id="toast"></div>

<script>
const PRS = [
  {id:1,org:"tidbcloud",repo:"cloud-storage-engine",repoShort:"CSE",num:"7160",numTail:"160",title:"coprocessor：服务端切页前先排空部分结果",author:"hwy",progress:"12/30",done:12,total:30,decisions:5,status:"进行中",summary:"服务端在切页前先排空部分结果，避免结果集过大占用内存。"},
  {id:2,org:"pingcap",repo:"tidb",repoShort:"TiDB",num:"73235",numTail:"235",title:"ddl：存储分层 less_than 支持 interval，并由 owner 定期重算",author:"lcwangchao",progress:"30/30",done:30,total:30,decisions:4,status:"已看完",summary:"存储分层的 less_than 边界支持 interval 写法，并由 owner 定期重算，减少手工维护成本。"},
  {id:3,org:"tikv",repo:"tikv",repoShort:"TiKV",num:"18512",numTail:"512",title:"raftstore：快照落盘前校验 checksum",author:"overvenus",progress:"0/14",done:0,total:14,decisions:2,status:"未开始",summary:"快照落盘前校验 checksum，避免坏块数据被持久化到磁盘。"},
  {id:4,org:"tidbcloud",repo:"cloud-storage-engine",repoShort:"CSE",num:"7172",numTail:"172",title:"compaction：大分区按 key 范围拆分后台任务",author:"hwy",progress:"3/22",done:3,total:22,decisions:1,status:"进行中",summary:"大分区 compaction 按 key 范围拆分为后台任务并行执行，缩短长尾耗时。"}
];
const REPO_COLOR = {"cloud-storage-engine":"#0969da","tidb":"#1a7f37","tikv":"#d1242f"};
const $ = (id)=>document.getElementById(id);

let currentId = 1;
let open = false;
let highlighted = 0;
let filtered = PRS.slice();

function currentPR(){ return PRS.find(p=>p.id===currentId); }

function renderCapsule(){
  const pr = currentPR();
  $("capsuleNum").textContent = "#" + pr.num;
  $("capsuleTitle").textContent = pr.title;
  $("capsuleTitle").title = pr.title;
  $("progressText").textContent = pr.progress;
}

function renderList(){
  const list = $("paletteList");
  if(!filtered.length){
    list.innerHTML = `<li class="empty">没有匹配的 PR</li>`;
    return;
  }
  list.innerHTML = filtered.map((pr,i)=>{
    const hl = i===highlighted ? " highlighted" : "";
    const pct = Math.round(pr.done/pr.total*100);
    return `<li class="palette-item${hl}" data-id="${pr.id}" data-i="${i}">
      <span class="avatar" style="background:${REPO_COLOR[pr.repo]}">${pr.repo[0].toUpperCase()}</span>
      <span class="pi-main">
        <div class="pi-title">${pr.title}</div>
        <div class="pi-meta"><span class="code">${pr.repo} #${pr.num}</span> · ${pr.author}</div>
      </span>
      <span class="pi-right">
        <div class="pi-bar"><div class="pi-bar-fill" style="width:${pct}%"></div></div>
        <div class="pi-dec">${pr.decisions} 件待拍板</div>
      </span>
    </li>`;
  }).join("");
}

function renderContent(pr){
  $("prTitle").textContent = pr.title;
  $("prSummary").textContent = pr.summary;
  $("decideLink").textContent = `有 ${pr.decisions} 件事需要你拍板 ↓`;
  $("progressText").textContent = pr.progress;
}

function switchPR(pr){
  if(!pr) return;
  currentId = pr.id;
  renderCapsule();
  const c = $("content");
  c.classList.add("fading");
  setTimeout(()=>{ renderContent(pr); c.classList.remove("fading"); },100);
  closePalette();
}

function openPalette(){
  open = true;
  $("overlay").classList.add("open");
  $("paletteSearch").value = "";
  filtered = PRS.slice();
  highlighted = Math.max(0, filtered.findIndex(p=>p.id===currentId));
  renderList();
  $("paletteSearch").focus();
}
function closePalette(){
  open = false;
  $("overlay").classList.remove("open");
}
function scrollHi(){
  const el = $("paletteList").querySelector(".highlighted");
  if(el) el.scrollIntoView({block:"nearest"});
}

$("capsule").addEventListener("click",()=>openPalette());
$("overlay").addEventListener("mousedown",(e)=>{ if(e.target===$("overlay")) closePalette(); });

$("paletteSearch").addEventListener("input",(e)=>{
  const q = e.target.value.trim().toLowerCase();
  filtered = PRS.filter(p=> p.title.toLowerCase().includes(q) || p.repo.toLowerCase().includes(q) || p.org.toLowerCase().includes(q) || String(p.num).includes(q) || p.author.toLowerCase().includes(q));
  highlighted = 0; renderList(); scrollHi();
});

$("paletteList").addEventListener("click",(e)=>{
  const item = e.target.closest(".palette-item");
  if(item) switchPR(PRS.find(p=>p.id===Number(item.dataset.id)));
});
$("paletteList").addEventListener("mousemove",(e)=>{
  const item = e.target.closest(".palette-item");
  if(item){ highlighted = Number(item.dataset.i); renderList(); }
});

$("paletteSearch").addEventListener("keydown",(e)=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); if(filtered.length){ highlighted=(highlighted+1)%filtered.length; renderList(); scrollHi(); } }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(filtered.length){ highlighted=(highlighted-1+filtered.length)%filtered.length; renderList(); scrollHi(); } }
  else if(e.key==="Enter"){ e.preventDefault(); const pr=filtered[highlighted]; if(pr) switchPR(pr); }
  else if(e.key==="Escape"){ closePalette(); $("capsule").focus(); }
});

document.addEventListener("keydown",(e)=>{
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==="k"){
    e.preventDefault();
    open ? closePalette() : openPalette();
  } else if(e.key==="Escape" && open){
    closePalette(); $("capsule").focus();
  }
});

// tabs
const tabButtons = Array.from(document.querySelectorAll(".tab"));
function moveUnderline(){
  const active = document.querySelector(".tab.active");
  $("underline").style.left = active.offsetLeft + "px";
  $("underline").style.width = active.offsetWidth + "px";
}
tabButtons.forEach(btn=>{
  btn.addEventListener("click",()=>{
    tabButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    moveUnderline();
  });
});

let toastTimer=null;
function showToast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}
$("decideLink").addEventListener("click",(e)=>{ e.preventDefault(); showToast(`跳转到 ${currentPR().decisions} 件待拍板事项（演示）`); });
$("btnDone").addEventListener("click",()=>showToast(`已将「${currentPR().title.slice(0,12)}…」标记为完成（演示）`));

renderCapsule();
renderContent(currentPR());
requestAnimationFrame(moveUnderline);
window.addEventListener("resize",moveUnderline);
</script>
</body>
</html>
